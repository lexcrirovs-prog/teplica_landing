limit_req_zone $binary_remote_addr zone=prgz_forms:10m rate=3r/m;
server {
 server_name prgz.ru www.prgz.ru;
 root /srv/prgz-site/releases/20261114;
 index index.html;
 add_header X-Content-Type-Options nosniff always;
 location = /erp { return 302 https://erp.prgz.ru/erp; }
 location /erp/ { return 302 https://erp.prgz.ru$request_uri; }
 location = /cldtesterp { return 302 https://erp-test.prgz.ru/cldtesterp/; }
 location /cldtesterp/ { return 302 https://erp-test.prgz.ru$request_uri; }
 location = /klad { return 302 /klad/; }
 location ^~ /klad/ {
  proxy_pass http://127.0.0.1:18080/;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Prefix /klad;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $remote_addr;
  include /etc/nginx/snippets/prgz-klad-proxy-secret.conf;
  client_max_body_size 25m;
 }
 location ~ ^/teplica[5-8]/handler\.php$ {
  client_max_body_size 16k;
  limit_req zone=prgz_forms burst=3 nodelay;
  limit_req_status 429;
  proxy_pass http://127.0.0.1:18770;
  proxy_set_header Host $host;
  proxy_read_timeout 30s;
 }
 location ~ \.php$ { return 404; }
 location ~ /\. { deny all; }
 location / { try_files $uri $uri/ =404; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/prgz.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/prgz.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = www.prgz.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = prgz.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


 listen 80;
 server_name prgz.ru www.prgz.ru;
    return 404; # managed by Certbot




}